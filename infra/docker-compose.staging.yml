version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: proofflow-api-staging
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - ENVIRONMENT=staging
      - EVIDENCE_STORAGE_DIR=/app/storage/evidence
      - TEMP_STORAGE_DIR=/app/storage/temp
    volumes:
      - proofflow_evidence_data:/app/storage/evidence
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: proofflow-web-staging
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  proofflow_evidence_data:
    name: proofflow_evidence_data
    driver: local
